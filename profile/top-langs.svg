<svg
  width="300"
  height="115"
  viewBox="0 0 300 115"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="descId"
>
  <title id="titleId">Most Used Languages</title>
  <desc id="descId">TypeScript 62.8%, Python 37.2%</desc>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #61dafb;
    }
    .lang-name {
      font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #ffffff;
    }
  </style>
  <rect
    x="0.5"
    y="0.5"
    rx="4.5"
    height="99%"
    stroke="#e4e2e2"
    width="299"
    fill="#20232a"
    stroke-opacity="1"
  />
  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header">Most Used Languages</text>
  </g>
  <g transform="translate(25, 55)">
    <mask id="rect-mask">
      <rect x="0" y="0" width="250" height="8" fill="white" rx="5"/>
    </mask>
    <rect mask="url(#rect-mask)" x="0" y="0" width="157" height="8" fill="#3178c6"/>
    <rect mask="url(#rect-mask)" x="157" y="0" width="93" height="8" fill="#3572A5"/>
    <g transform="translate(0, 25)">
      <circle cx="5" cy="6" r="5" fill="#3178c6"/>
      <text x="15" y="10" class="lang-name">TypeScript 62.8%</text>
    </g>
    <g transform="translate(150, 25)">
      <circle cx="5" cy="6" r="5" fill="#3572A5"/>
      <text x="15" y="10" class="lang-name">Python 37.2%</text>
    </g>
  </g>
</svg>
